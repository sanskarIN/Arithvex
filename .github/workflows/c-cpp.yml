name: C++ build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Debug, Release]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run regression tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Install release-candidate SDK
        if: matrix.build_type == 'Release'
        run: cmake --install build --config Release --prefix install

      - name: Smoke-test installed Arithvex CLI
        if: matrix.build_type == 'Release'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cli="./install/bin/ArithvexCLI.exe"
          else
            cli="./install/bin/ArithvexCLI"
          fi
          printf '0\n' | "$cli"

      - name: Build installed SDK consumer
        if: matrix.build_type == 'Release'
        run: |
          cmake -S tests/consumer -B consumer-build -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install
          cmake --build consumer-build --config Release --parallel

      - name: Run installed SDK consumer
        if: matrix.build_type == 'Release'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp install/bin/Arithvex.dll consumer-build/Release/
            ./consumer-build/Release/arithvex_consumer.exe
          else
            LD_LIBRARY_PATH="$PWD/install/lib:${LD_LIBRARY_PATH:-}" ./consumer-build/arithvex_consumer
          fi

      - name: Package release-candidate ZIP
        if: matrix.build_type == 'Release'
        shell: bash
        run: |
          set -euo pipefail
          cpack --config build/CPackConfig.cmake -C Release -G ZIP
          mkdir -p dist
          shopt -s nullglob
          packages=(Arithvex-1.0.0-rc.1-*.zip)
          if (( ${#packages[@]} == 0 )); then
            echo "No Arithvex release-candidate ZIP was generated" >&2
            exit 1
          fi
          mv -- "${packages[@]}" dist/

      - name: Generate release-candidate SHA-256 checksums
        if: matrix.build_type == 'Release'
        shell: bash
        run: |
          cd dist
          cmake -E sha256sum ./*.zip > SHA256SUMS.txt

      - name: Verify release-candidate contents and checksums
        if: matrix.build_type == 'Release'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS.txt
          shopt -s nullglob
          archives=(*.zip)
          if (( ${#archives[@]} == 0 )); then
            echo "No release candidate archives to verify" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            listing="$(cmake -E tar tf "$archive")"
            for expected in MathEngineExports.h ArithvexConfig.cmake LICENSE ArithvexCLI; do
              if ! grep -Fq "$expected" <<< "$listing"; then
                echo "Missing $expected from $archive" >&2
                exit 1
              fi
            done
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              grep -Fq Arithvex.dll <<< "$listing"
            else
              grep -Fq libArithvex.so <<< "$listing"
            fi
          done

      - name: Upload release-candidate archive
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Arithvex-v1.0.0-rc.1-${{ runner.os }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  sanitizer-test:
    name: ubuntu-latest / ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure sanitizers
        run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DARITHVEX_ENABLE_SANITIZERS=ON

      - name: Build sanitized math engine
        run: cmake --build build-sanitized --parallel

      - name: Test memory and undefined behavior
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure
