name: Verify and publish Arithvex v1.0.0

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.0.0.yml
      - CMakeLists.txt
      - docs/releases/v1.0.0.md
  push:
    branches: [main]
    paths:
      - docs/releases/v1.0.0.md

permissions:
  contents: read

concurrency:
  group: arithvex-v1-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package and verify / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Execute CTest
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install Arithvex SDK
        run: cmake --install build --config Release --prefix install

      - name: Verify installed CLI and external SDK consumer
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            printf '0\n' | ./install/bin/ArithvexCLI.exe
          else
            printf '0\n' | ./install/bin/ArithvexCLI
          fi
          cmake -S tests/consumer -B consumer-build -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build consumer-build --config Release --parallel
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp install/bin/Arithvex.dll consumer-build/Release/
            ./consumer-build/Release/arithvex_consumer.exe
          else
            LD_LIBRARY_PATH="$PWD/install/lib:${LD_LIBRARY_PATH:-}" ./consumer-build/arithvex_consumer
          fi

      - name: Build and independently validate ZIP distribution
        shell: bash
        run: |
          set -euo pipefail
          cpack --config build/CPackConfig.cmake -C Release -G ZIP
          mkdir -p dist
          shopt -s nullglob
          archives=(Arithvex-1.0.0-*.zip)
          if (( ${#archives[@]} != 1 )); then
            echo "Expected exactly one v1.0.0 ZIP, found ${#archives[@]}" >&2
            exit 1
          fi
          mv -- "${archives[0]}" dist/
          cd dist
          archive="$(basename "${archives[0]}")"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$archive" == *"-rc."* ]]; then
            echo "Refusing to publish a release-candidate archive as stable" >&2
            exit 1
          fi
          listing="$(cmake -E tar tf "$archive")"
          for expected in MathEngineExports.h ArithvexConfig.cmake LICENSE ArithvexCLI; do
            grep -Fq "$expected" <<< "$listing" || { echo "Missing $expected" >&2; exit 1; }
          done
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            grep -Fq Arithvex.dll <<< "$listing"
          else
            grep -Fq libArithvex.so <<< "$listing"
          fi
          # Exercise the CLI from the actual end-user ZIP after extraction.
          mkdir -p unpacked
          (
            cd unpacked
            cmake -E tar xf "../$archive"
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              executable="$(find . -type f -name ArithvexCLI.exe -print -quit)"
            else
              executable="$(find . -type f -name ArithvexCLI -print -quit)"
            fi
            if [[ -z "$executable" || ! -x "$executable" ]]; then
              echo "Missing executable CLI in extracted distribution" >&2
              exit 1
            fi
            printf '0\n' | "$executable"
          )
          cmake -E sha256sum "./$archive" > "SHA256SUMS-$RUNNER_OS.txt"
          sha256sum -c "SHA256SUMS-$RUNNER_OS.txt"

      - name: Upload verified ZIP with checksum
        uses: actions/upload-artifact@v4
        with:
          name: Arithvex-v1.0.0-${{ runner.os }}
          path: |
            dist/Arithvex-1.0.0-*.zip
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

  sanitizer:
    name: Linux / AddressSanitizer + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizer build
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DARITHVEX_ENABLE_SANITIZERS=ON
      - name: Build sanitized tests
        run: cmake --build build-asan --parallel
      - name: Run sanitized CTest
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  publish:
    name: Publish verified GitHub v1.0.0 release
    needs: [package, sanitizer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Enforce stable version and release notes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'project(Arithvex VERSION 1.0.0' CMakeLists.txt
          grep -Fq 'set(ARITHVEX_PRERELEASE "")' CMakeLists.txt
          test -s docs/releases/v1.0.0.md

      - name: Collect both platform distributions
        uses: actions/download-artifact@v4
        with:
          pattern: Arithvex-v1.0.0-*
          merge-multiple: true
          path: dist

      - name: Check platform archives and SHA-256 manifests
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          archives=(Arithvex-1.0.0-*.zip)
          if (( ${#archives[@]} != 2 )); then
            echo "Expected two different platform ZIP packages" >&2
            exit 1
          fi
          test -s SHA256SUMS-Windows.txt
          test -s SHA256SUMS-Linux.txt
          cat SHA256SUMS-Windows.txt SHA256SUMS-Linux.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          if grep -iq '\-rc\.' SHA256SUMS.txt; then
            echo "Release candidate references detected in stable distribution" >&2
            exit 1
          fi

      - name: Publish first stable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Stable release v1.0.0 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v1.0.0 dist/Arithvex-1.0.0-*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Arithvex v1.0.0" \
            --notes-file docs/releases/v1.0.0.md \
            --latest
